<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galgame 剧本格式转换器</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    margin: 0; padding: 16px;
    background: #f5f5f7; color: #222;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; margin-bottom: 12px;
    padding: 10px; background: #fff; border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  button {
    padding: 8px 14px; font-size: 14px; cursor: pointer;
    border: none; border-radius: 6px;
    background: #4a7dff; color: #fff;
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: #3a6ae0; }
  button:disabled { background: #bbb; cursor: not-allowed; }
  button.secondary { background: #6c757d; }
  button.secondary:hover:not(:disabled) { background: #5a6268; }
  button.danger { background: #dc3545; }
  button.danger:hover:not(:disabled) { background: #c82333; }

  .file-info { color: #4a7dff; font-size: 13px; margin-left: auto; }

  .progress-wrap {
    background: #fff; padding: 10px; border-radius: 8px;
    margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .progress-text { font-size: 13px; color: #555; margin-bottom: 6px; }
  .progress-bar {
    height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden;
  }
  .progress-bar > div {
    height: 100%; width: 0%; background: #4a7dff;
    transition: width .2s;
  }

  .editors {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  @media (max-width: 800px) {
    .editors { grid-template-columns: 1fr; }
  }
  .editor-box {
    background: #fff; border-radius: 8px; padding: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    display: flex; flex-direction: column;
  }
  .editor-box label {
    font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #444;
  }
  textarea {
    flex: 1; min-height: 400px; resize: vertical;
    font-family: Consolas, Monaco, monospace; font-size: 12px;
    padding: 8px; border: 1px solid #ddd; border-radius: 6px;
    outline: none;
  }
  textarea:focus { border-color: #4a7dff; }

  .status {
    margin-top: 12px; padding: 8px 12px; font-size: 13px;
    background: #fff; border-radius: 6px; color: #555;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    min-height: 20px;
  }
</style>
</head>
<body>

<h1>🎮 Galgame 剧本格式转换器</h1>

<div class="toolbar">
  <button id="btnConvert">转换</button>
  <button id="btnCancel" class="danger" disabled>取消</button>
  <button id="btnImport" class="secondary">导入 JSON 文件</button>
  <button id="btnExport" class="secondary">导出为 TXT</button>
  <button id="btnClear" class="secondary">清除</button>
  <button id="btnExample" class="secondary">加载示例</button>
  <span class="file-info" id="fileInfo">未选择文件</span>
</div>

<div class="progress-wrap">
  <div class="progress-text" id="progressText">就绪</div>
  <div class="progress-bar"><div id="progressBar"></div></div>
</div>

<div class="editors">
  <div class="editor-box">
    <label>原始剧本格式：</label>
    <textarea id="inputText" placeholder="在此粘贴剧本内容，或点击【导入 JSON 文件】"></textarea>
  </div>
  <div class="editor-box">
    <label>转换后格式 (JSON)：</label>
    <textarea id="outputText" placeholder="转换结果会显示在这里"></textarea>
  </div>
</div>

<div class="status" id="status">就绪</div>

<input type="file" id="fileInput" accept=".json,.txt" multiple style="display:none">

<script>
/* ============================================================
   Galgame 剧本格式转换器 - 纯前端版本 v2
   ============================================================ */

const state = {
  importedFiles: [],
  cancelFlag: false,
  isProcessing: false,
};

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const inputText    = $('inputText');
const outputText   = $('outputText');
const progressBar  = $('progressBar');
const progressText = $('progressText');
const statusEl     = $('status');
const fileInfo     = $('fileInfo');
const fileInput    = $('fileInput');

/* ---------- UI ---------- */
function setProgress(pct, msg) {
  progressBar.style.width = Math.min(100, Math.max(0, pct)) + '%';
  if (msg) progressText.textContent = msg;
}
function setStatus(msg) { statusEl.textContent = msg; }
function setFileInfo(msg) { fileInfo.textContent = msg; }

/* ============================================================
   工具函数
   ============================================================ */

function cleanText(text) {
  if (!text) return "";
  let t = text.replace(/\\n/g, "\n");
  t = t.replace(/;/g, "");
  const specialChars = ["%n", "；", "\\t", "\\r"];
  for (const ch of specialChars) t = t.split(ch).join("");
  return t.trim();
}

function formatSpeaker(speaker) {
  if (!speaker) return "";
  const s = speaker.trim();
  // 保留 [xxx] 标记（如 [CHAPTER1-1]、[target]）
  if (s.startsWith('[') && s.endsWith(']')) return s;
  if (s.includes('【') || s.includes('】')) return s;
  return `【${s}】`;
}

/* ---------- 从条目提取信息 ---------- */

function extractBackgroundAndBlur(entry) {
  if (!Array.isArray(entry) || entry.length < 5) return { bg: "", blur: false };
  const sceneData = entry[4];
  if (!sceneData || typeof sceneData !== 'object') return { bg: "", blur: false };
  const dataArray = sceneData.data;
  if (!Array.isArray(dataArray)) return { bg: "", blur: false };

  for (const item of dataArray) {
    if (!Array.isArray(item) || item.length < 3) continue;
    if (item[1] === "stage" && item[2] && typeof item[2] === 'object') {
      const redraw = item[2].redraw;
      if (redraw && typeof redraw === 'object') {
        const imageFile = redraw.imageFile;
        if (imageFile && typeof imageFile === 'object') {
          let file = imageFile.file || "";
          if (typeof file !== 'string') file = String(file);
          if (file) {
            if (file.includes('.')) file = file.split('.').slice(0, -1).join('.');
            return { bg: file, blur: checkDoBoxBlur(imageFile) };
          }
        }
      }
    }
  }
  return { bg: "", blur: false };
}

function checkDoBoxBlur(obj) {
  if (!obj) return false;
  if (typeof obj === 'string') return obj.includes("doBoxBlur");
  if (Array.isArray(obj)) return obj.some(checkDoBoxBlur);
  if (typeof obj === 'object') return Object.values(obj).some(checkDoBoxBlur);
  return false;
}

function extractCharacters(dataArray) {
  if (!Array.isArray(dataArray)) return "";
  const chars = [];
  for (const item of dataArray) {
    if (!Array.isArray(item) || item.length < 3) continue;
    if (item[1] === "character" && item[2] && item[2].showmode === 3) {
      const redraw = item[2].redraw;
      if (redraw && typeof redraw === 'object') {
        const imageFile = redraw.imageFile;
        if (imageFile && typeof imageFile === 'object') {
          let file = imageFile.file || "";
          if (typeof file !== 'string') file = String(file);
          if (file) {
            const options = imageFile.options || {};
            const parts = [];
            if (options.dress) parts.push(`dress=${options.dress}`);
            if (options.pose)  parts.push(`pose=${options.pose}`);
            const query = parts.join("&");
            chars.push(query ? `${file}?${query}` : file);
          }
        }
      }
    }
  }
  return chars.join(";");
}

function extractCharactersFromEntry(entry) {
  if (!Array.isArray(entry) || entry.length < 5) return "";
  const sceneData = entry[4];
  if (!sceneData || typeof sceneData !== 'object') return "";
  return extractCharacters(sceneData.data || []);
}

function extractCGFromEntry(entry) {
  if (!Array.isArray(entry) || entry.length < 5) return "";
  const sceneData = entry[4];
  if (!sceneData || typeof sceneData !== 'object') return "";
  const dataArray = sceneData.data;
  if (!Array.isArray(dataArray)) return "";

  const cgList = [];
  for (const item of dataArray) {
    if (!Array.isArray(item) || item.length < 3) continue;
    if ((item[1] === "sdlayer" || item[1] === "event") && item[2] && typeof item[2] === 'object') {
      const redraw = item[2].redraw;
      if (redraw && typeof redraw === 'object') {
        const imageFile = redraw.imageFile;
        if (imageFile && typeof imageFile === 'object') {
          let file = imageFile.file || "";
          if (typeof file !== 'string') file = String(file);
          if (file) {
            if (file.includes('.')) file = file.split('.').slice(0, -1).join('.');
            cgList.push(file);
          }
        }
      }
    }
  }
  return cgList.join(";");
}

function extractTextFromEntry(entry) {
  try {
    if (Array.isArray(entry) && Array.isArray(entry[1]) && entry[1].length > 0) {
      const inner = entry[1][0];
      if (Array.isArray(inner) && inner.length >= 2) {
        const raw = inner[1];
        if (typeof raw === 'string') return cleanText(raw);
      }
    }
  } catch (e) {}
  return "";
}

function extractSpeakerFromEntry(entry) {
  try {
    if (Array.isArray(entry) && Array.isArray(entry[1]) && entry[1].length > 0) {
      const inner = entry[1][0];
      if (Array.isArray(inner) && inner.length >= 1) {
        const innerSpk = inner[0];
        if (typeof innerSpk === 'string' && innerSpk.trim()) return innerSpk;
      }
    }
    if (Array.isArray(entry) && entry.length >= 1) {
      const outerSpk = entry[0];
      if (typeof outerSpk === 'string' && outerSpk.trim()) return outerSpk;
    }
  } catch (e) {}
  return "";
}

/* ---------- 括号匹配 ---------- */

function findMatchingBracket(text, start) {
  const len = text.length;
  let pos = start, stack = 0, inString = false, escape = false;
  while (pos < len) {
    const ch = text[pos];
    if (escape) {
      escape = false;
    } else if (inString) {
      if (ch === '\\') escape = true;
      else if (ch === '"') inString = false;
    } else {
      if (ch === '"') inString = true;
      else if (ch === '[') stack++;
      else if (ch === ']') {
        stack--;
        if (stack === 0) return pos + 1;
      }
    }
    pos++;
  }
  return -1;
}

/* ---------- 主查找 ---------- */

function findAllScriptEntriesOrdered(inputData, cancelCtx) {
  if (!inputData) return [];
  if (inputData.charCodeAt(0) === 0xFEFF) inputData = inputData.slice(1);

  // 章节标记
  const chapterRegex = /chapter.*?(\d+-\d+)/gi;
  const chapterMatches = [];
  let m;
  while ((m = chapterRegex.exec(inputData)) !== null) {
    chapterMatches.push({ pos: m.index, cs: m[1] });
  }
  const seen = new Set();
  const uniqueChapters = [];
  for (const cm of chapterMatches) {
    if (!seen.has(cm.cs)) { seen.add(cm.cs); uniqueChapters.push(cm); }
  }
  uniqueChapters.sort((a, b) => a.pos - b.pos);

  // ⭐ 关键修复：正则放宽，只匹配到对话文本开头，后面交给 findMatchingBracket
  const patterns = [
    // [null,[[null,"text"...
    { re: /\[null,\s*\[\[null,\s*"((?:[^"\\]|\\.)*)"/g, type: "no_speaker" },
    // ["outer",[["inner","text"...
    { re: /\["((?:[^"\\]|\\.)*)",\s*\[\["((?:[^"\\]|\\.)*)",\s*"((?:[^"\\]|\\.)*)"/g, type: "inner_speaker" },
    // ["outer",[[null,"text"...
    { re: /\["((?:[^"\\]|\\.)*)",\s*\[\[null,\s*"((?:[^"\\]|\\.)*)"/g, type: "outer_speaker" },
  ];

  let currentPos = 0;
  const length = inputData.length;
  const allItems = [];

  while (currentPos < length) {
    if (cancelCtx.cancelled) break;

    let earliestMatch = null;
    let earliestPos = length;
    let earliestPatternIdx = -1;

    for (let i = 0; i < patterns.length; i++) {
      patterns[i].re.lastIndex = currentPos;
      const mm = patterns[i].re.exec(inputData);
      if (mm && mm.index < earliestPos) {
        earliestPos = mm.index;
        earliestMatch = mm;
        earliestPatternIdx = i;
      }
    }

    if (!earliestMatch) break;

    const startPos = earliestPos;
    const endPos = findMatchingBracket(inputData, startPos);

    if (endPos === -1) { currentPos = startPos + 1; continue; }

    const entryStr = inputData.substring(startPos, endPos);

    try {
      const entry = JSON.parse(entryStr);
      if (Array.isArray(entry) && entry.length >= 2) {
        const text = extractTextFromEntry(entry);
        if (text) {
          const speakerRaw = extractSpeakerFromEntry(entry);
          const { bg, blur } = extractBackgroundAndBlur(entry);
          const characters = extractCharactersFromEntry(entry);
          const cg = extractCGFromEntry(entry);
          allItems.push({
            pos: startPos,
            item: {
              speaker_raw: speakerRaw,
              speaker: formatSpeaker(speakerRaw),
              text, background: bg, blur,
              characters, cg
            }
          });
        }
        // nexts 跳转
        if (entry.length >= 5 && entry[4] && typeof entry[4] === 'object') {
          const nexts = entry[4].nexts;
          if (Array.isArray(nexts)) {
            for (const n of nexts) {
              if (n && typeof n === 'object' && "target" in n) {
                allItems.push({
                  pos: endPos,
                  item: {
                    speaker_raw: `[${n.target}]`,
                    speaker: `[${n.target}]`,
                    text: "", background: "ecall", blur: false,
                    characters: "", cg: ""
                  }
                });
              }
            }
          }
        }
      }
    } catch (e) {
      // 兜底
      const ptype = patterns[earliestPatternIdx].type;
      let text = "";
      if (ptype === "no_speaker")           text = earliestMatch[1];
      else if (ptype === "inner_speaker")   text = earliestMatch[3];
      else                                  text = earliestMatch[2];
      text = cleanText(text);
      if (text) {
        allItems.push({
          pos: startPos,
          item: {
            speaker_raw: "", speaker: "", text,
            background: "", blur: false, characters: "", cg: ""
          }
        });
      }
    }

    currentPos = endPos;
  }

  allItems.sort((a, b) => a.pos - b.pos);

  // 插入章节
  const finalEntries = [];
  let chapIdx = 0;
  for (const { pos, item } of allItems) {
    while (chapIdx < uniqueChapters.length && uniqueChapters[chapIdx].pos < pos) {
      const cs = uniqueChapters[chapIdx].cs;
      finalEntries.push({
        speaker_raw: `[CHAPTER${cs}]`, speaker: `[CHAPTER${cs}]`,
        text: "", background: "ecall", blur: false,
        characters: "", cg: ""
      });
      chapIdx++;
    }
    finalEntries.push(item);
  }
  while (chapIdx < uniqueChapters.length) {
    const cs = uniqueChapters[chapIdx].cs;
    finalEntries.push({
      speaker_raw: `[CHAPTER${cs}]`, speaker: `[CHAPTER${cs}]`,
      text: "", background: "ecall", blur: false,
      characters: "", cg: ""
    });
    chapIdx++;
  }

  return finalEntries;
}

/* ---------- 立绘处理 ---------- */

function processCharacters(entries) {
  const getRawSpeaker = spk => {
    if (!spk) return "";
    const m = spk.match(/【(.+?)】/);
    return m ? m[1] : spk.trim();
  };
  const uniquePoses = s => {
    if (!s) return s;
    const seen = new Set();
    return s.split(';').filter(p => !seen.has(p) && seen.add(p)).join(';');
  };

  const isRef = new Array(entries.length).fill(false);

  for (let i = 0; i < entries.length; i++) {
    const item = entries[i];
    const spkFormatted = item.speaker || "";
    if (!spkFormatted) continue;
    const charStr = item.characters || "";
    if (!charStr) continue;

    let poses = charStr.split(';');
    const originalLen = poses.length;
    const seen = new Set();
    poses = poses.filter(p => !seen.has(p) && seen.add(p));

    const spkRaw = getRawSpeaker(spkFormatted);
    const matched = poses.filter(p => p.startsWith(spkRaw + '.'));
    if (matched.length) {
      item.characters = matched[0];
      if (originalLen > 1) isRef[i] = true;
    } else {
      item.characters = poses.join(';');
    }
  }

  for (let i = 0; i < entries.length; i++) {
    if (isRef[i]) continue;
    const item = entries[i];
    let charStr = item.characters || "";
    if (!charStr) continue;
    let poses = charStr.split(';');
    const seen = new Set();
    poses = poses.filter(p => !seen.has(p) && seen.add(p));

    if (poses.length <= 1) { item.characters = poses.join(';'); continue; }

    let refIdx = null;
    for (let j = i - 1; j >= 0; j--) {
      if (isRef[j]) { refIdx = j; break; }
    }
    if (refIdx !== null) {
      const refRaw = getRawSpeaker(entries[refIdx].speaker || "");
      const matched = poses.filter(p => p.startsWith(refRaw + '.'));
      item.characters = matched.length ? matched[0] : poses[0];
    } else {
      item.characters = poses[0];
    }
  }

  for (const item of entries) {
    if (item.characters) item.characters = uniquePoses(item.characters);
  }
}

/* ---------- 主转换 ---------- */

async function convertAll(inputData, cancelCtx) {
  const entries = findAllScriptEntriesOrdered(inputData, cancelCtx);
  setStatus(`成功提取 ${entries.length} 条对话`);
  if (cancelCtx.cancelled) return null;

  if (entries.length) processCharacters(entries);

  setProgress(75, "正在格式化输出...");

  const result = {};
  const total = entries.length;
  for (let i = 0; i < total; i++) {
    if (cancelCtx.cancelled) return null;

    if (i % 200 === 0) {
      const pct = 75 + (i / total) * 25;
      setProgress(pct, `正在格式化条目: ${i+1}/${total}`);
      await new Promise(r => setTimeout(r, 0));
    }

    const it = entries[i];
    const d = {};
    if (it.background) d.b = it.background;
    if (it.speaker)    d.s = it.speaker;
    if (it.text)       d.t = it.text;
    if (it.characters) d.c = it.characters;
    if (it.blur)       d.z = 2;
    if (it.cg)         d.cg = it.cg;
    if (Object.keys(d).length) result[String(i + 1)] = d;
  }

  return result;
}

/* ============================================================
   按钮事件
   ============================================================ */

$('btnConvert').addEventListener('click', async () => {
  if (state.isProcessing) return;
  state.isProcessing = true;
  state.cancelFlag = false;
  $('btnConvert').disabled = true;
  $('btnCancel').disabled = false;

  const cancelCtx = { get cancelled() { return state.cancelFlag; } };

  try {
    if (state.importedFiles.length) {
      setProgress(0, "正在从文件读取内容...");
      const parts = [];
      const total = state.importedFiles.length;
      for (let i = 0; i < total; i++) {
        if (state.cancelFlag) break;
        const f = state.importedFiles[i];
        setProgress((i+1)/total*30, `读取文件: ${f.name} (${i+1}/${total})`);
        parts.push(await f.text());
        await new Promise(r => setTimeout(r, 0));
      }
      if (state.cancelFlag) return;
      const result = await convertAll(parts.join("\n"), cancelCtx);
      if (result) outputText.value = JSON.stringify(result, null, 2);
    } else {
      const data = inputText.value.trim();
      if (!data) { alert("请输入原始剧本数据"); return; }
      const result = await convertAll(data, cancelCtx);
      if (result) outputText.value = JSON.stringify(result, null, 2);
    }

    if (!state.cancelFlag) {
      setProgress(100, "处理完成");
      setStatus("转换完成");
    }
  } catch (err) {
    console.error(err);
    alert("转换错误: " + err.message);
    setStatus("转换出错");
  } finally {
    state.isProcessing = false;
    $('btnConvert').disabled = false;
    $('btnCancel').disabled = true;
  }
});

$('btnCancel').addEventListener('click', () => {
  if (state.isProcessing) {
    state.cancelFlag = true;
    setStatus("正在取消处理...");
  }
});

$('btnImport').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  state.importedFiles = files;

  setFileInfo(files.length === 1 ? `已导入: ${files[0].name}` : `已导入 ${files.length} 个文件`);

  const preview = files.slice(0, 10);
  const chunks = [];
  for (let i = 0; i < preview.length; i++) {
    const content = await preview[i].text();
    chunks.push(`\n${'='.repeat(60)}\n文件: ${preview[i].name}\n${'='.repeat(60)}\n${content}`);
  }
  if (files.length > preview.length) {
    chunks.push(`\n\n${'='.repeat(60)}\n提示: 还有 ${files.length - preview.length} 个文件未显示（共 ${files.length} 个文件）\n${'='.repeat(60)}`);
  }
  inputText.value = chunks.join("\n\n");
  setStatus(`已成功导入 ${files.length} 个文件`);
});

$('btnExport').addEventListener('click', () => {
  const text = outputText.value.trim();
  if (!text) { alert("没有可导出的内容，请先进行转换"); return; }

  let jsonData;
  try {
    jsonData = JSON.parse(text);
  } catch (err) {
    if (confirm("输出内容不是有效的 JSON，是否作为纯文本导出？")) {
      downloadFile("scriptData_error.txt", text);
    }
    return;
  }

  if (typeof jsonData !== 'object' || Array.isArray(jsonData)) {
    alert("输出内容不是有效的 JSON 对象");
    return;
  }

  let items = Object.entries(jsonData);
  if (items.every(([k]) => /^\d+$/.test(k))) {
    items.sort((a, b) => Number(a[0]) - Number(b[0]));
  }

  if (!items.length) { alert("没有有效的对话条目"); return; }

  const chunkSize = 500;
  const numChunks = Math.ceil(items.length / chunkSize);

  for (let c = 0; c < numChunks; c++) {
    const chunk = items.slice(c * chunkSize, (c + 1) * chunkSize);
    const obj = {};
    for (const [k, v] of chunk) obj[k] = v;
    const content = JSON.stringify(obj, null, 2);
    const filename = `scriptData${c + 1}.txt`;
    setTimeout(() => downloadFile(filename, content), c * 100);
  }

  setStatus(`导出完成，共 ${numChunks} 个文件`);
  if (numChunks > 1) {
    alert(`已触发 ${numChunks} 个文件下载，请检查浏览器是否弹出"允许多文件下载"提示。`);
  }
});

function downloadFile(filename, content) {
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
